<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>3D viewer – __SITE_NAME__</title>
    <meta
      name="description"
      content="Turn and light a 3D sculpture in your browser, for drawing and painting reference."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="view" aria-label="3D model. Drag to turn, scroll to zoom."></canvas>

      <header class="brand">
        <h1 id="title">&nbsp;</h1>
        <p class="tagline" id="artist">&nbsp;</p>
        <a class="back" href="../"><span aria-hidden="true">←</span> All models</a>
      </header>

      <div class="controls">
        <canvas
          id="light-ball"
          class="light-ball"
          width="176"
          height="176"
          tabindex="0"
          role="slider"
          title="Drag to move the light"
          aria-label="Light direction. Drag the bright spot, or use the arrow keys. The outer ring puts the light behind the model."
        ></canvas>
        <input
          id="bg"
          class="bg-slider"
          type="range"
          min="0"
          max="100"
          value="0"
          title="Background brightness"
          aria-label="Background brightness"
        />
        <button
          id="recenter"
          class="tool"
          type="button"
          aria-pressed="false"
          title="Recenter: click a part of the model to turn and zoom around it (or double-click it)"
          aria-label="Recenter on a part of the model"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="6" />
            <path d="M12 2v5M12 17v5M2 12h5M17 12h5" />
          </svg>
        </button>
        <button id="reset-view" class="tool" type="button" title="Reset view to the whole model" aria-label="Reset view">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6" />
          </svg>
        </button>
        <button
          id="save-view"
          class="tool"
          type="button"
          title="Save this view: camera, zoom and light"
          aria-label="Save this view"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 4h10v16l-5-4-5 4z" />
          </svg>
        </button>
        <button
          id="load-view"
          class="tool"
          type="button"
          title="Back to the saved view"
          aria-label="Back to the saved view"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12a7 7 0 1 0 2.05-4.95M5 4v4h4" />
          </svg>
        </button>
      </div>

      <div class="status" id="status" role="status">Loading model…</div>

      <footer class="credit" id="credit"></footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
