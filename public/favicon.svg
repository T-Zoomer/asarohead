<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A plaster sphere lit from the upper left, with its cast shadow. -->
  <defs>
    <radialGradient id="light" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f4f4f2"/>
      <stop offset="0.55" stop-color="#a9a9a4"/>
      <stop offset="0.85" stop-color="#3a3a37"/>
      <stop offset="1" stop-color="#55554f"/>
    </radialGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#000" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="19" cy="28" rx="12" ry="3.6" fill="url(#shadow)"/>
  <ellipse cx="18" cy="27.7" rx="9" ry="2.4" fill="#050506"/>
  <circle cx="15" cy="14" r="12" fill="url(#light)"/>
</svg>
